name: installer-checks

on:
  push:
    paths:
      - 'install_fastfetch.py'
      - 'init2.0.sh'
      - '.github/workflows/installer-checks.yml'
  pull_request:
    paths:
      - 'install_fastfetch.py'
      - 'init2.0.sh'
      - '.github/workflows/installer-checks.yml'
  workflow_dispatch:
    inputs:
      run_install_test:
        description: 'Run real fastfetch installer tests in Linux containers'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile install_fastfetch.py

      - name: Check shell syntax
        run: bash -n init2.0.sh

  install-test:
    name: Install test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_install_test == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            image: debian:bookworm
            bootstrap: apt-get update && apt-get install -y python3 git curl ca-certificates
          - distro: debian-13
            image: debian:trixie
            bootstrap: apt-get update && apt-get install -y python3 git curl ca-certificates
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y python3 git curl ca-certificates
          - distro: fedora
            image: fedora:latest
            bootstrap: dnf install -y python3 git curl ca-certificates
          - distro: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm python git curl ca-certificates
          - distro: alpine
            image: alpine:latest
            bootstrap: apk add --no-cache python3 git curl ca-certificates bash
          - distro: opensuse
            image: opensuse/leap:latest
            bootstrap: zypper --non-interactive install python3 git curl ca-certificates
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap container
        run: ${{ matrix.bootstrap }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer
        env:
          FASTFETCH_VERSION: '2.65.1'
        run: python3 install_fastfetch.py

      - name: Verify fastfetch
        run: |
          command -v fastfetch
          fastfetch --version

      - name: Verify profile hook
        run: grep -F "$(command -v fastfetch)" /etc/profile

  alpine-binary-test:
    name: Alpine binary install
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_install_test == 'true'
    timeout-minutes: 15
    container:
      image: alpine:latest
    steps:
      - name: Bootstrap container
        run: apk add --no-cache python3 curl ca-certificates bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer without build dependencies
        env:
          FASTFETCH_VERSION: '2.65.1'
          FASTFETCH_INSTALL_METHOD: binary
        run: python3 install_fastfetch.py

      - name: Verify fastfetch
        run: |
          command -v fastfetch
          fastfetch --version
          ! command -v gcc
          ! command -v cmake

  alpine-low-space-mode:
    name: Alpine low-space mode
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_install_test == 'true'
    timeout-minutes: 15
    container:
      image: alpine:latest
    steps:
      - name: Bootstrap container
        run: apk add --no-cache python3 curl ca-certificates bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Add existing autofetch profile entries
        run: |
          cat >> /etc/profile <<'EOF'

          # AutoFetch Hook
          if [ -x /usr/local/bin/AutoFetch ]; then
              if [ "$(tty)" = "/dev/console" ] || [ -n "$SSH_TTY" ]; then
                  /usr/local/bin/AutoFetch
              fi
          fi
          # AutoFetch already disabled by user
          # /usr/local/bin/AutoFetch
          AutoFetch --color
          # AutoFetch --already-disabled
          EOF

      - name: Run installer with lolcat skipped
        env:
          FASTFETCH_VERSION: '2.65.1'
          FASTFETCH_INSTALL_METHOD: binary
          FASTFETCH_MIN_LOLCAT_SPACE_MB: '999999'
        run: python3 install_fastfetch.py

      - name: Verify low-space behavior
        run: |
          command -v fastfetch
          fastfetch --version
          ! command -v lolcat
          grep -F "$(command -v fastfetch) || true" /etc/profile
          grep -F "# 已由FastFetch安装脚本禁用旧的AutoFetch Hook" /etc/profile
          grep -F "# if [ -x /usr/local/bin/AutoFetch ]; then" /etc/profile
          grep -F '    # if [ "$(tty)" = "/dev/console" ] || [ -n "$SSH_TTY" ]; then' /etc/profile
          grep -F "# /usr/local/bin/AutoFetch" /etc/profile
          test "$(grep -F '# fi' /etc/profile | wc -l)" -ge 2
          grep -F "# AutoFetch --color" /etc/profile
          grep -F "# AutoFetch --already-disabled" /etc/profile
          grep -F "# AutoFetch already disabled by user" /etc/profile
          ! grep -Fx "AutoFetch --color" /etc/profile
          ! grep -Fx "                  /usr/local/bin/AutoFetch" /etc/profile
          sh -n /etc/profile

  alpine-init-bootstrap:
    name: Alpine init bootstrap
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_install_test == 'true'
    timeout-minutes: 15
    container:
      image: alpine:latest
    steps:
      - name: Bootstrap container without Python
        run: apk add --no-cache bash curl ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run init fastfetch menu option
        env:
          FASTFETCH_INSTALL_METHOD: binary
          FASTFETCH_INSTALL_LOLCAT: skip
        run: printf '21\n' | bash init2.0.sh

      - name: Verify bootstrap result
        run: |
          command -v python3
          command -v fastfetch
          fastfetch --version
          sh -n /etc/profile
